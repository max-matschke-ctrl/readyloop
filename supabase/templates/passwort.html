<h2>Passwort zurücksetzen</h2>
<p>Über den folgenden Link legen Sie ein neues Passwort für Readyloop fest:</p>
<p><a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/passwort-neu">Neues Passwort festlegen</a></p>
<p>Wenn Sie das nicht angefordert haben, können Sie die E-Mail ignorieren.</p>
